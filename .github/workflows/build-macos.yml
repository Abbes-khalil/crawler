name: Build macOS desktop app

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build crawler sidecar (PyInstaller)
        working-directory: .
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements-build.txt
          pyinstaller desktop_main.spec --noconfirm

      - name: Install sidecar into Tauri bin/
        run: |
          mkdir -p frontend/src-tauri/bin
          cp dist/asbizdev-crawler "frontend/src-tauri/bin/asbizdev-crawler-${{ matrix.target }}"
          chmod +x "frontend/src-tauri/bin/asbizdev-crawler-${{ matrix.target }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tauri app
        working-directory: frontend
        # bundles=app only: Tauri's dmg bundler (bundle_dmg.sh, which drives
        # Finder/hdiutil) is known to fail intermittently on GitHub's macOS
        # runners. The .app is what actually matters; zip it ourselves below.
        run: npx tauri build --target ${{ matrix.target }} --bundles app

      - name: Zip the .app
        working-directory: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: ditto -c -k --sequesterRsrc --keepParent "AS Biz Dev Web Intelligence.app" "AS-Biz-Dev-Web-Intelligence-${{ matrix.target }}.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-Biz-Dev-Web-Intelligence-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/macos/AS-Biz-Dev-Web-Intelligence-${{ matrix.target }}.zip
          if-no-files-found: error
