name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AS-Biz-Dev-Web-Intelligence-windows
          - os: macos-14
            artifact: AS-Biz-Dev-Web-Intelligence-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build bundle (PyInstaller)
        run: pyinstaller packaging/launcher.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if (-not $version) { $version = "0.0.0-dev" }
          iscc /DAppVersion=$version packaging\windows\installer.iss

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_app.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*-setup.exe
            dist/*.dmg
          if-no-files-found: error
